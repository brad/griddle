name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Prettier check (changed files)
        run: |
          FILES=$(git diff --name-only origin/main...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 'scripts/**/*.js' 'scripts/**/*.cjs' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            npx prettier --check $FILES
          else
            echo "No changed source files to check."
          fi

      - name: Build
        run: npm run build